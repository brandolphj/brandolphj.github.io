<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="site-logo" href="{{ '/' | relative_url }}">
        JARED BRANDOLPH <span class="prompt">&gt;<span class="cursor">_</span></span>
      </a>
    </div>

    <nav class="site-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}"
         {% if page.url == '/' %}class="active"{% endif %}>HOME</a>
      <a href="{{ '/projects/' | relative_url }}"
         {% if page.url contains '/projects/' %}class="active"{% endif %}>PROJECTS</a>
      <a href="{{ '/about/' | relative_url }}"
         {% if page.url == '/about/' %}class="active"{% endif %}>ABOUT</a>
    </nav>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© {{ 'now' | date: '%Y' }} Jared Brandolph</p>
    </div>
  </footer>
</body>
</html>
