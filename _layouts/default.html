<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
     
<a class="site-logo" href="{{ '/' | relative_url }}">
  <span id="decrypt-name">JARED BRANDOLPH</span>
</a>

    </div>

    <nav class="site-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}"
         {% if page.url == '/' %}class="active"{% endif %}>HOME</a>
      <a href="{{ '/projects/' | relative_url }}"
         {% if page.url contains '/projects/' %}class="active"{% endif %}>PROJECTS</a>
      <a href="{{ '/about/' | relative_url }}"
         {% if page.url == '/about/' %}class="active"{% endif %}>ABOUT</a>
    </nav>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© {{ 'now' | date: '%Y' }} Jared Brandolph</p>
    </div>
  </footer>
  
<script>
document.addEventListener("DOMContentLoaded", () => {
  const element = document.getElementById("decrypt-name");
  if (!element) return;

  const finalText = "JARED BRANDOLPH";
  const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&";
  const duration = 1500;
  const interval = 40;

  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    element.textContent = finalText;
    return;
  }

  let startTime = null;

  function animate(timestamp) {
    if (startTime === null) startTime = timestamp;

    const elapsed = timestamp - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const revealed = Math.floor(progress * finalText.length);

    element.textContent = finalText
      .split("")
      .map((letter, index) => {
        if (letter === " ") return " ";
        if (index < revealed) return letter;

        return characters[
          Math.floor(Math.random() * characters.length)
        ];
      })
      .join("");

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      element.textContent = finalText;
    }
  }

  requestAnimationFrame(animate);
});
</script>

</body>
</html>
