<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">

  <!-- Chakra Petch font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Your website CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
     
<a class="site-logo" href="{{ '/' | relative_url }}">
  <span id="decrypt-name">JARED BRANDOLPH</span>
</a>

    </div>

    <nav class="site-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}"
         {% if page.url == '/' %}class="active"{% endif %}>HOME</a>
      <a href="{{ '/projects/' | relative_url }}"
         {% if page.url contains '/projects/' %}class="active"{% endif %}>PROJECTS</a>
      <a href="{{ '/about/' | relative_url }}"
         {% if page.url == '/about/' %}class="active"{% endif %}>ABOUT</a>
    </nav>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© {{ 'now' | date: '%Y' }} Jared Brandolph</p>
    </div>
  </footer>
  


<script>
document.addEventListener("DOMContentLoaded", () => {
  const element = document.getElementById("decrypt-name");
  if (!element) return;

  const finalText = "JARED BRANDOLPH";
  const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  const duration = 1400;
  const frameDelay = 65;

  let startTime = null;
  let lastFrame = 0;

  function scramble(revealed) {
    return finalText.split("").map((char, index) => {
      if (char === " ") return " ";
      if (index < revealed) return char;

      return characters[
        Math.floor(Math.random() * characters.length)
      ];
    }).join("");
  }

  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    element.textContent = finalText;
    return;
  }

  element.textContent = scramble(0);

  function animate(timestamp) {
    if (startTime === null) startTime = timestamp;

    const elapsed = timestamp - startTime;
    const progress = Math.min(elapsed / duration, 1);

    // Smooth acceleration
    const eased = progress * progress * (3 - 2 * progress);
    const revealed = Math.floor(eased * finalText.length);

    if (timestamp - lastFrame >= frameDelay || progress === 1) {
      element.textContent = scramble(revealed);
      lastFrame = timestamp;
    }

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      element.textContent = finalText;
    }
  }

  requestAnimationFrame(animate);
});
</script>



</body>
</html>
