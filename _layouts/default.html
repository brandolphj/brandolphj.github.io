<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">

  <!-- Chakra Petch font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Your website CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
     
<a class="site-logo" href="{{ '/' | relative_url }}">
  <span id="decrypt-name">JARED BRANDOLPH</span>
</a>

    </div>

    <nav class="site-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}"
         {% if page.url == '/' %}class="active"{% endif %}>HOME</a>
      <a href="{{ '/projects/' | relative_url }}"
         {% if page.url contains '/projects/' %}class="active"{% endif %}>PROJECTS</a>
      <a href="{{ '/about/' | relative_url }}"
         {% if page.url == '/about/' %}class="active"{% endif %}>ABOUT</a>
    </nav>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© {{ 'now' | date: '%Y' }} Jared Brandolph</p>
    </div>
  </footer>
  



<script>
(() => {
  const finalText = "JARED BRANDOLPH";
  const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  const duration = 2300;
  const frameDelay = 85;

  let animationId = null;

  function startAnimation() {
    const element = document.getElementById("decrypt-name");
    if (!element) {
      console.error("Decryption: name element not found");
      return;
    }

    if (animationId !== null) {
      cancelAnimationFrame(animationId);
    }

    let startTime = null;
    let lastFrame = -Infinity;

    function render(progress) {
      const eased = 1 - Math.pow(1 - progress, 2);
      const revealed = Math.floor(eased * finalText.length);

      element.replaceChildren();

      finalText.split("").forEach((char, index) => {
        const span = document.createElement("span");

        if (char === " ") {
          span.textContent = "\u00A0";
        } else if (index < revealed) {
          span.textContent = char;
        } else {
          span.textContent = characters[
            Math.floor(Math.random() * characters.length)
          ];
          span.style.opacity = "0.35";
        }

        element.appendChild(span);
      });
    }

    render(0);

    function animate(timestamp) {
      if (startTime === null) startTime = timestamp;

      const progress = Math.min((timestamp - startTime) / duration, 1);

      if (timestamp - lastFrame >= frameDelay || progress === 1) {
        render(progress);
        lastFrame = timestamp;
      }

      if (progress < 1) {
        animationId = requestAnimationFrame(animate);
      } else {
        element.textContent = finalText;
        animationId = null;
      }
    }

    animationId = requestAnimationFrame(animate);
    console.log("Decryption animation started");
  }

  window.addEventListener("pageshow", startAnimation);
})();
</script>




</body>
</html>
