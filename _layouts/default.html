<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">

  <!-- Chakra Petch font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <style>
    /* TERMLINK SYSTEM HEADER */

    .termlink-status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 0 0 20px;
      color: #70db91;
      font-family: "Courier New", monospace;
      font-size: 12px;
      letter-spacing: 0.2px;
    }

    .termlink-connected {
      white-space: nowrap;
    }

    /* BLINKING TERMINAL CURSOR */

    .typing-cursor {
      display: inline-block;
      width: 0.4em;
      height: 0.78em;
      margin-left: 0.08em;
      background-color: #70db91;
      vertical-align: -0.07em;

      animation-name: termlink-cursor-blink;
      animation-duration: 1s;
      animation-timing-function: step-end;
      animation-iteration-count: infinite;
    }

    @keyframes termlink-cursor-blink {
      0%, 49% {
        opacity: 1;
      }

      50%, 100% {
        opacity: 0;
      }
    }

    /* MOBILE */

    @media (max-width: 600px) {
      .termlink-status-bar {
        font-size: 11px;
        padding-bottom: 16px;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">

    <!-- SYSTEM STATUS -->

    <div class="termlink-status-bar">
      <span>
        Welcome to JBCO Industries (TM) TermLink
      </span>

      <span class="termlink-connected">
        &#9679; CONNECTED
      </span>
    </div>

    <!-- ANIMATED NAME -->

    <div class="header-inner">
      <a class="site-logo" href="{{ '/' | relative_url }}">
        <span id="decrypt-name">JARED BRANDOLPH</span><span
          class="typing-cursor"
          aria-hidden="true"></span>
      </a>
    </div>

    <!-- NAVIGATION -->

    <nav class="site-nav" aria-label="Main navigation">

      <a href="{{ '/' | relative_url }}"
         {% if page.url == '/' %}class="active"{% endif %}>
        HOME
      </a>

      <a href="{{ '/projects/' | relative_url }}"
         {% if page.url contains '/projects/' %}class="active"{% endif %}>
        PROJECTS
      </a>

      <a href="{{ '/about/' | relative_url }}"
         {% if page.url == '/about/' %}class="active"{% endif %}>
        ABOUT
      </a>

    </nav>

  </header>

  <!-- PAGE CONTENT -->

  <main class="container">
    {{ content }}
  </main>

  <!-- FOOTER -->

  <footer class="site-footer">
    <div class="container">
      <p>© {{ 'now' | date: '%Y' }} Jared Brandolph</p>
    </div>
  </footer>

  <!-- FALLOUT-STYLE TYPING ANIMATION -->

  <script>
    (() => {
      const finalText = "JARED BRANDOLPH";
      const characterDelay = 115;

      let typingTimer = null;

      function startTyping() {
        const element = document.getElementById("decrypt-name");

        if (!element) return;

        if (typingTimer !== null) {
          clearTimeout(typingTimer);
        }

        element.textContent = "";

        let index = 0;

        function typeNextCharacter() {
          if (index >= finalText.length) {
            typingTimer = null;
            return;
          }

          element.textContent += finalText.charAt(index);
          index++;

          typingTimer = setTimeout(
            typeNextCharacter,
            characterDelay
          );
        }

        typeNextCharacter();
      }

      window.addEventListener("pageshow", startTyping);
    })();
  </script>

</body>
</html>
