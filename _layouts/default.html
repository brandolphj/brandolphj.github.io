<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>

  <meta name="description" content="{{ page.description | default: site.description | escape }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,900&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <style>
    .termlink-status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 0 0 20px;
      color: #70db91;
      font-family: "Courier New", monospace;
      font-size: 12px;
      letter-spacing: 0.2px;
    }

    .termlink-connected {
      white-space: nowrap;
    }

    /* Fallout-inspired header name */
    .site-logo {
      display: inline-block;
      color: #70db91;
      font-family: "Barlow Condensed", sans-serif;
      font-size: clamp(32px, 4vw, 48px);
      font-weight: 900;
      font-style: italic;
      letter-spacing: 0.5px;
      line-height: 1.3;
      text-align: center;
    }

    #decrypt-name {
      display: inline-block;
      white-space: nowrap;
    }

    /* Blinking green cursor */
    .typing-cursor {
      display: inline-block;
      width: 0.25em;
      height: 0.78em;
      margin-left: 0.08em;
      background-color: #70db91;
      vertical-align: -0.07em;
      animation: termlink-cursor-blink 0.8s step-end infinite;
    }

    @keyframes termlink-cursor-blink {
      0%, 49% {
        opacity: 1;
      }

      50%, 100% {
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      .termlink-status-bar {
        font-size: 11px;
        padding-bottom: 16px;
      }

      .site-logo {
        font-size: clamp(26px, 7vw, 38px);
        letter-spacing: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .typing-cursor {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">

    <div class="termlink-status-bar">
      <span>Welcome to JBCO Industries (TM) TermLink</span>
      <span class="termlink-connected">&#9679; CONNECTED</span>
    </div>

    <div class="header-inner">
      <a class="site-logo" href="{{ '/' | relative_url }}">
        <span id="decrypt-name">JARED BRANDOLPH</span><span
          class="typing-cursor" aria-hidden="true"></span>
      </a>
    </div>

    <nav class="site-nav" aria-label="Main navigation">

      <a href="{{ '/' | relative_url }}"
         {% if page.url == '/' %}class="active"{% endif %}>
        HOME
      </a>

      <a href="{{ '/projects/' | relative_url }}"
         {% if page.url contains '/projects/' %}class="active"{% endif %}>
        PROJECTS
      </a>

      <a href="{{ '/about/' | relative_url }}"
         {% if page.url == '/about/' %}class="active"{% endif %}>
        ABOUT
      </a>

    </nav>

  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© {{ 'now' | date: '%Y' }} Jared Brandolph</p>
    </div>
  </footer>

  <script>
    (() => {
      const element = document.getElementById("decrypt-name");
      if (!element) return;

      const finalText = "JARED BRANDOLPH";
      const characterDelay = 115;

      // Animate only on the homepage.
      const path = window.location.pathname;
      const isHomepage = path === "/" || path === "/index.html";

      if (!isHomepage) {
        element.textContent = finalText;
        return;
      }

      let typingTimer = null;

      function startTyping() {
        if (typingTimer !== null) {
          clearTimeout(typingTimer);
        }

        element.textContent = "";
        let index = 0;

        function typeNextCharacter() {
          if (index >= finalText.length) {
            typingTimer = null;
            return;
          }

          element.textContent += finalText.charAt(index);
          index++;

          typingTimer = setTimeout(
            typeNextCharacter,
            characterDelay
          );
        }

        typeNextCharacter();
      }

      // Run immediately on initial page load.
      startTyping();

      // Replay when returning using browser history.
      window.addEventListener("pageshow", (event) => {
        if (event.persisted) {
          startTyping();
        }
      });
    })();
  </script>

</body>
</html>
